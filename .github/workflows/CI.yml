
name: validacion pagina

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validacion:
    name: crear una maquina virtual
    runs-on: ubuntu-latest

    steps:
      - name: clonar repositorio
        uses: actions/checkout@v4

      - name: instalar node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: validar codigo HTML
        run: |
          echo "inicio"
          npx --yes html-validate "**/*.html"
          echo "fin"
